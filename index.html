<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>귀 청소 ASMR 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#10121a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;width:100%;padding:14px;pointer-events:none;display:flex;justify-content:space-between;align-items:start;text-shadow:0 2px 5px #000}#stats{background:#161821bd;padding:10px 14px;border-radius:14px}#bar{height:8px;background:#ffffff33;border-radius:8px;overflow:hidden;margin-top:7px;width:125px}#fill{height:100%;background:#77dfab;width:0%}#tools{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:9px}button{border:1px solid #ffffff45;border-radius:15px;background:#222635e8;color:white;padding:13px 16px;font-size:15px;font-weight:700;box-shadow:0 5px 18px #0005}button.active{background:#f0a477;color:#22170f}#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#151515d9;padding:14px 20px;border-radius:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#intro{position:fixed;inset:0;background:#10121ad9;display:flex;align-items:center;justify-content:center;padding:24px}#panel{max-width:360px;text-align:center;background:#252939;border-radius:24px;padding:26px;box-shadow:0 10px 50px #0008}#panel h1{font-size:27px}#panel p{line-height:1.65;color:#d9dbe4}#panel button{background:#f0a477;color:#23160e;width:100%;margin-top:12px}#reset{pointer-events:auto}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="stats"><b id="level">손님 1</b><div id="score">💰 0원</div><div id="bar"><div id="fill"></div></div><small id="count">귀지 0개 남음</small></div><button id="reset">↻ 다시</button></div><div id="toast"></div><div id="tools"><button data-tool="pick" class="active">🥄 귀이개</button><button data-tool="swab">☁️ 면봉</button><button data-tool="scope">🔎 확대</button></div><div id="intro"><div id="panel"><h1>👂 귀 청소 ASMR 3D</h1><p>귀 안에 있는 귀지를 손가락으로 긁어서 제거해 봐!<br>귀이개는 큰 귀지, 면봉은 작은 귀지에 효과적이야.<br>화면을 드래그하면 도구가 움직여.</p><button id="start">청소 시작하기</button></div></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d');let W,H,dpr,level=1,money=0,tool='pick',zoom=false,waxes=[],particles=[],pointer={x:0,y:0,down:false},cleared=0,total=0,done=false;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.opacity=0,1200)}function startLevel(){waxes=[];particles=[];cleared=0;done=false;total=Math.min(8+level*3,24);for(let i=0;i<total;i++){let a=rand(0,Math.PI*2),r=Math.sqrt(Math.random())*.78;waxes.push({x:Math.cos(a)*r,y:Math.sin(a)*r*.83,rad:rand(.035,.085),shade:rand(0,1),hp:rand(1,2.7),max:2.7,removed:false,rot:rand(0,7),seed:rand(0,7)})}updateHud()}function updateHud(){document.querySelector('#level').textContent='손님 '+level;document.querySelector('#score').textContent='💰 '+money.toLocaleString()+'원';document.querySelector('#count').textContent='귀지 '+(total-cleared)+'개 남음';document.querySelector('#fill').style.width=cleared/total*100+'%'}function geom(){let s=Math.min(W*.95,H*.67)*(zoom?1.16:1),cx=W/2,cy=H*.49;return {s,cx,cy}}function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function render(){let {s,cx,cy}=geom();g.fillStyle='#15141b';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(cx,cy,s*.1,cx,cy,s*.9);bg.addColorStop(0,'#8e5b4b');bg.addColorStop(.55,'#b47d67');bg.addColorStop(1,'#29212a');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.translate(cx,cy);g.rotate(-.16);ellipse(0,0,s*.51,s*.61,'#c78e77');ellipse(-s*.01,s*.02,s*.43,s*.53,'#e6ab8e');ellipse(s*.04,-s*.02,s*.36,s*.45,'#9e574b');let inner=g.createRadialGradient(s*.06,-s*.05,s*.015,0,0,s*.4);inner.addColorStop(0,'#1b0c0c');inner.addColorStop(.25,'#391b19');inner.addColorStop(.65,'#703b33');inner.addColorStop(1,'#b76f5d');ellipse(0,0,s*.36,s*.43,inner);g.strokeStyle='#eab39a';g.lineWidth=s*.038;g.beginPath();g.ellipse(-s*.018,s*.01,s*.39,s*.47,0,.18,Math.PI*1.9);g.stroke();g.restore();for(let w of waxes){if(w.removed)continue;let x=cx+w.x*s*.36,y=cy+w.y*s*.43,r=w.rad*s;g.save();g.translate(x,y);g.rotate(w.rot);g.shadowColor='#160b05';g.shadowBlur=r*.45;g.shadowOffsetY=r*.18;let grad=g.createRadialGradient(-r*.3,-r*.3,1,0,0,r);grad.addColorStop(0,w.shade>.5?'#c79536':'#ad722f');grad.addColorStop(.55,'#80501d');grad.addColorStop(1,'#38220f');g.fillStyle=grad;g.beginPath();for(let i=0;i<=18;i++){let a=i/18*Math.PI*2,rr=r*(.87+.13*Math.sin(i*3+w.seed));if(i===0)g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.fill();g.shadowBlur=0;ellipse(-r*.25,-r*.27,r*.23,r*.13,'#e0b45a');g.restore()}for(let p of particles){g.globalAlpha=p.life;ellipse(p.x,p.y,p.r,p.r,p.color);p.x+=p.vx;p.y+=p.vy;p.life-=.035}g.globalAlpha=1;particles=particles.filter(p=>p.life>0);if(pointer.x){let x=pointer.x,y=pointer.y;g.save();g.translate(x,y);g.rotate(-.55);g.strokeStyle=tool==='swab'?'#d3dfed':'#bec5cc';g.lineWidth=tool==='swab'?7:5;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.lineTo(95,95);g.stroke();if(tool==='swab'){ellipse(0,0,13,9,'#f4f5f6')}else{g.strokeStyle='#e0e5e9';g.lineWidth=4;g.beginPath();g.arc(0,0,9,.3,Math.PI*1.65);g.stroke()}g.restore()}requestAnimationFrame(render)}function interact(x,y){if(done)return;let {s,cx,cy}=geom();for(let w of waxes){if(w.removed)continue;let wx=cx+w.x*s*.36,wy=cy+w.y*s*.43;if(Math.hypot(x-wx,y-wy)<w.rad*s+15){let efficiency=tool==='pick'?(w.rad>.055?.28:.13):(w.rad<.06?.35:.12);w.hp-=efficiency;if(w.hp<=0){w.removed=true;cleared++;money+=100+level*20;for(let i=0;i<11;i++)particles.push({x:wx,y:wy,vx:rand(-3,3),vy:rand(-3,3),r:rand(1,4),life:1,color:'#c58c37'});if(navigator.vibrate)navigator.vibrate(15);updateHud();if(cleared===total){done=true;money+=500*level;updateHud();toast('✨ 완벽한 청소! 보너스 지급');setTimeout(()=>{level++;startLevel();toast('새 손님 등장!')},1900)}}break}}}let last=0;function move(e){pointer.x=e.clientX;pointer.y=e.clientY;if(pointer.down&&performance.now()-last>35){interact(pointer.x,pointer.y);last=performance.now()}}c.addEventListener('pointerdown',e=>{pointer.down=true;c.setPointerCapture(e.pointerId);move(e);interact(pointer.x,pointer.y)});c.addEventListener('pointermove',move);c.addEventListener('pointerup',()=>pointer.down=false);c.addEventListener('pointercancel',()=>pointer.down=false);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(b.dataset.tool==='scope'){zoom=!zoom;b.classList.toggle('active',zoom);toast(zoom?'확대 ON':'확대 OFF')}else{tool=b.dataset.tool;document.querySelectorAll('[data-tool]:not([data-tool="scope"])').forEach(t=>t.classList.toggle('active',t===b))}});document.querySelector('#start').onclick=()=>{document.querySelector('#intro').remove();startLevel()};document.querySelector('#reset').onclick=()=>{level=1;money=0;startLevel();toast('처음부터 다시 시작!')};render();
</script></body></html>
