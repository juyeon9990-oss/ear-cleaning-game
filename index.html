<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111421"><title>Ear Cleaning ASMR Deluxe</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131d;color:#f7f5f1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;pointer-events:none}#top>*{pointer-events:auto}.pill{background:#171c2edc;border:1px solid #ffffff21;border-radius:16px;padding:9px 12px;backdrop-filter:blur(12px)}#name{font-size:12px;color:#c3c9d5}#progress{width:138px;height:7px;border-radius:8px;background:#ffffff27;margin-top:7px;overflow:hidden}#progress>i{display:block;height:100%;width:0;background:#86e4b2;transition:width .2s}#money{font-weight:800;color:#ffe19d}#toolbar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:8px;right:8px;display:flex;gap:6px;justify-content:center}#toolbar button{background:#22293ae8;border:1px solid #ffffff2b;border-radius:15px;flex:1;min-width:0;padding:10px 2px;font-size:11px;box-shadow:0 6px 16px #0007}#toolbar button span{display:block;font-size:22px;margin-bottom:4px}#toolbar button.sel{background:#f4bd90;color:#1c1820;border-color:#fff1}#actions{position:fixed;top:calc(env(safe-area-inset-top) + 83px);right:12px;display:flex;flex-direction:column;gap:8px}#actions button{border:1px solid #ffffff2d;border-radius:13px;background:#171c2edc;padding:9px 11px;font-size:12px}#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 91px);left:50%;transform:translateX(-50%);font-size:12px;background:#10131dd9;padding:9px 13px;border-radius:20px;white-space:nowrap;pointer-events:none}#toast{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);background:#10131ded;padding:13px 19px;border-radius:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:5}#modal{position:fixed;inset:0;background:#080a12d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:8}#modal.hide{display:none}#panel{width:min(420px,100%);max-height:85dvh;overflow:auto;background:#22283a;border:1px solid #ffffff26;border-radius:25px;padding:22px;box-shadow:0 18px 80px #000b}h1{font-size:24px;margin:4px 0 12px}h2{font-size:18px}p{color:#c7cedc;line-height:1.6;font-size:14px}.primary,.secondary{width:100%;padding:14px;border-radius:14px;border:0;margin-top:9px;font-weight:800}.primary{background:#f3b98c;color:#24191a}.secondary{background:#394156}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#30394e;border-radius:12px;padding:12px;font-size:13px}.tile b{display:block;margin-bottom:5px}.tile button{margin-top:7px;background:#f3b98c;color:#211;border:0;border-radius:9px;padding:8px;width:100%;font-weight:700}.muted{font-size:12px;color:#abb3c4}.tag{color:#a4eac8;font-size:12px}#compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}#compare img{width:100%;border-radius:10px;background:#000}#compare small{display:block;text-align:center;color:#ccd}#zoom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 155px);left:14px;background:#171c2ebd;border-radius:12px;padding:8px;font-size:12px}#zoom input{width:100px;vertical-align:middle}button:focus-visible{outline:3px solid #fff}
</style></head><body><canvas id="scene" aria-label="귀 청소 게임 화면"></canvas><div id="top"><div class="pill"><b id="level">손님 1</b><div id="name">청소 진행률</div><div id="progress"><i></i></div></div><div class="pill"><div id="money">🪙 0</div><div class="muted" id="score">별점 ★★★★★</div></div></div><div id="actions"><button id="sound">🔊 소리 켜기</button><button id="relax">🌙 ASMR 모드</button><button id="shop">🛍️ 상점</button><button id="book">📖 도감</button><button id="photo">📷 전후 비교</button><button id="next">➡️ 다음 손님</button></div><div id="zoom">🔍 <input id="zoomSlider" aria-label="카메라 확대" type="range" min="1" max="1.6" step="0.05" value="1"></div><div id="hint">도구를 선택하고 귀지를 문지르거나 끌어내세요</div><div id="toolbar"><button data-tool="pick" class="sel"><span>🥄</span>귀이개</button><button data-tool="swab"><span>🧽</span>면봉</button><button data-tool="tweezer"><span>🗜️</span>핀셋</button><button data-tool="suction"><span>🌀</span>흡입기</button><button data-tool="camera"><span>🔦</span>내시경</button></div><div id="toast"></div><div id="modal"><div id="panel"></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d'),panel=$('panel'),modal=$('modal');let W=0,H=0,DPR=1,scale=1,zoom=1,tool='pick',down=false,prev=null,held=null,particles=[],wax=[],before='',after='',finished=false,relax=false,soundOn=false,audio=null,lastSound=0,lastTick=0,score=5,dirty=0;const prices={pick:0,swab:0,tweezer:90,suction:180,camera:260};let saved={coins:0,level:1,owned:['pick','swab'],collection:{},cleared:0};try{saved={...saved,...JSON.parse(localStorage.getItem('earDeluxeV2')||'{}')}}catch(e){}if(!Array.isArray(saved.owned))saved.owned=['pick','swab'];const persist=()=>{try{localStorage.setItem('earDeluxeV2',JSON.stringify(saved))}catch(e){}};const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const types=['황금 귀지','마른 귀지','부드러운 귀지','커다란 귀지','희귀 수정 귀지'];const colors=['#c88b32','#8e6135','#b97a41','#795025','#d9b768'];function toast(s){$('toast').textContent=s;$('toast').style.opacity='1';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity='0',1300)}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);scale=Math.min(W/390,H/760)*zoom}addEventListener('resize',resize);resize();function sound(kind){if(!soundOn||!audio)return;const t=audio.currentTime;if(t-lastSound<.045)return;lastSound=t;try{const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type=kind==='pop'?'sine':'triangle';osc.frequency.setValueAtTime(kind==='pop'?390:kind==='suction'?105:rand(220,460),t);osc.frequency.exponentialRampToValueAtTime(kind==='pop'?110:kind==='suction'?80:rand(80,170),t+.09);filter.type='lowpass';filter.frequency.value=kind==='pop'?1500:800;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(kind==='pop'?.18:.04,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+.12);osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.13)}catch(e){}}function vibration(){if(navigator.vibrate)navigator.vibrate(18)}function generate(){wax=[];particles=[];finished=false;score=5;dirty=0;const n=7+Math.min(saved.level*2,17);for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),r=Math.sqrt(Math.random())*125;wax.push({x:Math.cos(a)*r,y:Math.sin(a)*r*.91,r:rand(10,21),hp:rand(32,85),max:85,kind:Math.random()<.055?4:Math.floor(rand(0,4)),vx:0,vy:0,rot:rand(0,6),gone:false})}updateHUD();draw();before=canvas.toDataURL('image/jpeg',.68);after=''}function updateHUD(){$('level').textContent=`손님 ${saved.level} · ${['민지','하린','서아','유나','지수'][((saved.level-1)%5)]}`;$('money').textContent=`🪙 ${saved.coins}`;$('score').textContent='별점 '+'★'.repeat(Math.round(score))+'☆'.repeat(5-Math.round(score));$('progress').firstElementChild.style.width=`${Math.round(wax.filter(x=>x.gone).length/Math.max(1,wax.length)*100)}%`}$('sound').onclick=async()=>{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('이 브라우저는 소리를 지원하지 않아요');return}audio=new AC()}await audio.resume();soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐';if(soundOn)sound('pop')};$('relax').onclick=()=>{relax=!relax;$('relax').textContent=relax?'☀️ 일반 모드':'🌙 ASMR 모드';$('top').style.opacity=relax?'.3':'1';$('hint').textContent=relax?'힐링 ASMR · 청소 소리에 집중하세요':'도구를 선택하고 귀지를 문지르거나 끌어내세요'};function open(html){panel.innerHTML=html;modal.classList.remove('hide')}function close(){modal.classList.add('hide')}function shop(){open(`<h1>🛍️ 청소샵 상점</h1><p>보유 코인 🪙 ${saved.coins} · 장비는 구매 후 사용 가능해요.</p><div class="grid">${[['tweezer','🗜️ 핀셋'],['suction','🌀 흡입기'],['camera','🔦 내시경']].map(([id,label])=>`<div class="tile"><b>${label}</b><span>${saved.owned.includes(id)?'보유 중':prices[id]+' 코인'}</span><button data-buy="${id}" ${saved.owned.includes(id)?'disabled':''}>${saved.owned.includes(id)?'구매 완료':'구매'}</button></div>`).join('')}</div><button class="secondary" id="dismiss">돌아가기</button>`);panel.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy;if(saved.coins<prices[id])return toast('코인이 부족해요');saved.coins-=prices[id];saved.owned.push(id);persist();updateHUD();shop();toast('장비 구매 완료!')});$('dismiss').onclick=close}function book(){open(`<h1>📖 귀지 도감</h1><p>청소한 귀지가 자동으로 기록돼요.</p><div class="grid">${types.map((t,i)=>`<div class="tile"><b>${['🟡','🟤','🟠','🪨','💎'][i]} ${t}</b><span>${saved.collection[i]||0}개 수집</span></div>`).join('')}</div><button class="secondary" id="dismiss">돌아가기</button>`);$('dismiss').onclick=close}function compare(){open(`<h1>📷 청소 전후 비교</h1><p>현재 손님의 귀 청소 변화</p><div id="compare"><div><img src="${before}"><small>청소 전</small></div><div><img src="${after||canvas.toDataURL('image/jpeg',.7)}"><small>청소 후 / 현재</small></div></div><button class="secondary" id="dismiss">돌아가기</button>`);$('dismiss').onclick=close}function next(){if(!finished)return toast('귀지를 모두 제거해 주세요!');saved.level++;persist();generate();toast('새로운 손님이 왔어요!')} $('shop').onclick=shop;$('book').onclick=book;$('photo').onclick=compare;$('next').onclick=next;$('zoomSlider').oninput=e=>{zoom=Number(e.target.value);resize()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const id=b.dataset.tool;if(!saved.owned.includes(id)){shop();return}tool=id;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('sel',x===b));toast({pick:'귀이개: 문질러 제거',swab:'면봉: 부드럽게 닦기',tweezer:'핀셋: 잡고 끌어내기',suction:'흡입기: 길게 누르기',camera:'내시경: 확대 관찰'}[id])});function local(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left-W/2)/scale,y:(e.clientY-rect.top-H*.46)/scale}}function hit(p){return wax.filter(w=>!w.gone).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0]}function remove(w){if(w.gone)return;w.gone=true;saved.coins+=5+(w.kind===4?25:0);saved.collection[w.kind]=(saved.collection[w.kind]||0)+1;persist();for(let i=0;i<13;i++)particles.push({x:w.x,y:w.y,vx:rand(-3,3),vy:rand(-4,1),life:rand(15,32),c:colors[w.kind]});sound('pop');vibration();toast(w.kind===4?'💎 희귀 귀지 발견! +30':'✨ 깔끔하게 제거! +5');updateHUD();if(wax.every(x=>x.gone)){finished=true;after=canvas.toDataURL('image/jpeg',.75);saved.cleared++;saved.coins+=Math.round(score*12);persist();updateHUD();setTimeout(()=>open(`<h1>🎉 청소 완료!</h1><p>손님 ${saved.level} 청소 성공!<br>평점 ${score.toFixed(1)} / 5 · 보너스 ${Math.round(score*12)}코인</p><button class="primary" id="goNext">다음 손님 맞이하기 →</button><button class="secondary" id="viewBefore">전후 비교 보기</button>`),350);setTimeout(()=>{const b=$('goNext'),v=$('viewBefore');if(b)b.onclick=()=>{close();next()};if(v)v.onclick=compare},370)}}function work(p){if(finished||tool==='camera')return;const w=hit(p);if(!w||Math.hypot(w.x-p.x,w.y-p.y)>w.r+24)return;if(tool==='tweezer'){if(!held)held=w;w.x+=(p.x-w.x)*.22;w.y+=(p.y-w.y)*.22;if(Math.hypot(w.x,w.y)>165)remove(w);else sound('scratch')}else{const damage=tool==='suction'?4.5:tool==='pick'?3.2:1.9;w.hp-=damage;w.vx+=(p.x-w.x)*.009;w.vy+=(p.y-w.y)*.009;w.r=Math.max(4,w.r-.08);if(w.hp<=0)remove(w);else sound(tool==='suction'?'suction':'scratch')}}canvas.addEventListener('pointerdown',e=>{if(!modal.classList.contains('hide'))return;down=true;prev=local(e);canvas.setPointerCapture(e.pointerId);work(prev)});canvas.addEventListener('pointermove',e=>{if(!down)return;const p=local(e);work(p);prev=p});const end=()=>{down=false;held=null;prev=null};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#211d29');bg.addColorStop(1,'#090c16');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H*.46);ctx.scale(scale,scale);let g=ctx.createRadialGradient(0,0,15,0,0,270);g.addColorStop(0,'#3b1c1d');g.addColorStop(.35,'#8f4c45');g.addColorStop(.66,'#c27e6b');g.addColorStop(.87,'#df9e87');g.addColorStop(1,'#583636');ellipse(0,0,210,225,g);g=ctx.createRadialGradient(-18,-28,0,0,0,169);g.addColorStop(0,'#120c12');g.addColorStop(.4,'#281719');g.addColorStop(.72,'#58302d');g.addColorStop(.9,'#995a4e');g.addColorStop(1,'#d18b75');ellipse(0,0,170,184,g);for(let i=0;i<7;i++){const r=156-i*13;ctx.beginPath();ctx.ellipse(0,0,r,r*1.08,0,Math.PI*.07,Math.PI*1.94);ctx.strokeStyle=`rgba(248,178,151,${.13+i*.018})`;ctx.lineWidth=5+i*.6;ctx.stroke()}ellipse(0,0,56,63,'#170e14');for(const w of wax){if(w.gone)continue;w.vx*=.91;w.vy*=.91;w.x+=w.vx;w.y+=w.vy;const max=155;if(Math.hypot(w.x,w.y)>max){w.x*=.985;w.y*=.985}ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.rot);ctx.shadowColor='#120b09';ctx.shadowBlur=8;ctx.shadowOffsetY=4;const c=colors[w.kind];ellipse(0,0,w.r*1.12,w.r*.85,c);ctx.shadowBlur=0;ellipse(-w.r*.22,-w.r*.28,w.r*.35,w.r*.18,'#ffffff32');ctx.restore()}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life--;ellipse(p.x,p.y,Math.max(0,p.life/8),Math.max(0,p.life/9),p.c)}particles=particles.filter(p=>p.life>0);if(tool==='camera'){ctx.strokeStyle='#9ee8e4';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,85,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(0,-15);ctx.lineTo(0,15);ctx.stroke()}ctx.restore();if(down&&prev){const x=W/2+prev.x*scale,y=H*.46+prev.y*scale;ctx.save();ctx.translate(x,y);ctx.rotate(-.55);ctx.shadowBlur=12;ctx.shadowColor='#000';ctx.fillStyle='#cbd8dd';ctx.fillRect(-4,-64,8,68);ctx.fillStyle=tool==='swab'?'#f6f5ed':tool==='suction'?'#657f8e':'#aabac4';ellipse(0,5,tool==='swab'?11:6,tool==='swab'?13:8,ctx.fillStyle);ctx.restore()} }function frame(t){if(t-lastTick>15){draw();lastTick=t}requestAnimationFrame(frame)}generate();requestAnimationFrame(frame);open(`<div class="tag">DELUXE EDITION · v2.0</div><h1>👂 Ear Cleaning ASMR</h1><p>리얼한 내시경 느낌의 귀 청소 게임! 손가락으로 귀지를 제거하고 코인을 모아 도구를 구매하세요.</p><div class="grid"><div class="tile">🎧 ASMR 효과음</div><div class="tile">🪙 코인과 상점</div><div class="tile">📖 귀지 도감</div><div class="tile">📷 청소 전후 비교</div></div><p class="muted">소리는 게임 시작 후 오른쪽 위 '소리 켜기'를 눌러 활성화해 주세요. 실제 3D 엔진이 아닌 2.5D 원근 시뮬레이션이며, 진동은 지원 기기에서만 작동합니다.</p><button class="primary" id="start">게임 시작하기</button>`);$('start').onclick=()=>{close();toast('도구로 귀지를 문질러 보세요!')};})();
</script></body></html>
